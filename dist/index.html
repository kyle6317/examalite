<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Exama Lite — Coming Soon</title>

  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif:wght@700&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">

  <style>
    :root {
      --paper-50: #faf9f6;
      --paper-200: #e8e4d9;

      --ink-500: #3a3731;
      --ink-600: #27251f;
      --ink-300: #8c8679;

      --accent-500: #2d6899;
      --accent-600: #1f5280;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background: var(--paper-50);
      color: var(--ink-500);
      font-family: "DM Sans", sans-serif;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .container {
      text-align: center;
      padding: 32px;
      border: 1px solid var(--paper-200);
      border-radius: 8px;
      background: #ffffff;
      box-shadow: 0 1px 3px rgba(58, 55, 49, 0.08);
      max-width: 520px;
      width: 90%;
    }

    h1 {
      font-family: "Noto Serif", serif;
      font-size: 32px;
      color: var(--ink-600);
      margin-bottom: 12px;
    }

    p {
      font-size: 14px;
      color: var(--ink-300);
      margin-bottom: 16px;
      line-height: 1.6;
    }

    .badge {
      display: inline-block;
      padding: 4px 10px;
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      border-radius: 4px;
      border: 1px solid var(--paper-200);
      margin-bottom: 16px;
    }

    .link {
      display: inline-block;
      margin-top: 8px;
      font-size: 14px;
      color: var(--accent-500);
      text-decoration: none;
      font-weight: 500;
    }

    .link:hover {
      color: var(--accent-600);
      text-decoration: underline;
    }

    footer {
      margin-top: 24px;
      font-size: 12px;
      color: var(--ink-300);
    }
  </style>
</head>

<body>
  <div class="container">
    <div class="badge">Exama Lite</div>

    <h1>Coming Soon</h1>

    <p>
      Exama Lite is a lightweight exam and assessment management platform.
    </p>

    <p>
      Learn more:
      <br />
      <a href="https://github.com/kyle6317/examalite" class="link" target="_blank">
        github.com/kyle6317/examalite
      </a>
    </p>

    <footer>
      © 2026 Exama. All rights reserved.
    </footer>
  </div>
</body>
</html>
